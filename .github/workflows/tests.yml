name: SDK and Maya adapter regression tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.7', '3.9', '3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q max_payne_sdk max_payne_maya max_payne_sdk_ldb_importer.py max_payne_sdk_kf2_importer.py
